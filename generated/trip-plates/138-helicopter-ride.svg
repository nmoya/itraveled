.stop .leader { fill: none; stroke: #89978e; stroke-width: 1px; }
.stop .place { fill: #f7f3ea; font: 700 17px system-ui, sans-serif; paint-order: stroke; stroke: #17261f; stroke-width: 5px; stroke-linejoin: round; }</style>
