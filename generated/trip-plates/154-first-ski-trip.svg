.route { fill: none; stroke: #e7b44c; stroke-linecap: round; stroke-linejoin: round; stroke-width: 5px; }
.stop circle { fill: #f7f3ea; stroke: #ef7d58; stroke-width: 5px; }
.stop .number { fill: #18201c; font: 700 12px system-ui, sans-serif; text-anchor: middle; }
.stop .leader { fill: none; stroke: #89978e; stroke-width: 1px; }
.stop .place { fill: #f7f3ea; font: 700 17px system-ui, sans-serif; paint-order: stroke; stroke: #17261f; stroke-width: 5px; stroke-linejoin: round; }</style>
